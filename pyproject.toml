[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saslite"
version = "0.4.1"
description = "Lightweight SAS language interpreter with statistical analysis capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "SASLite contributors" },
]
keywords = [
    "sas",
    "sas-language",
    "interpreter",
    "data-step",
    "proc-sql",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "lark>=1.2.2",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyreadstat>=1.2.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0"]
gui = [
    "flask>=3.0.0",
    "pywebview>=5.0.0",
]

[project.scripts]
saslite = "saslite.cli.main:main"
saslite-gui = "saslite.gui.app:main"
saslite-desktop = "saslite.gui.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saslite = [
    "parser/grammar/*.lark",
    "gui/static/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
